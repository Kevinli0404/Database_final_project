name: database_final_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^6.1.0
  fluttertoast: ^8.2.8
  provider: ^6.1.2
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
    - assets/audio/
    - assets/json/
    - assets/character_pictures/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/genshin_app_logo.jpg" 
